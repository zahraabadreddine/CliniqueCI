services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: cliniqueci-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npx knex migrate:latest && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cliniqueci-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false   # à renseigner manuellement : URL du frontend Render
      - key: ANTHROPIC_API_KEY
        sync: false   # optionnel — laisser vide si pas utilisé
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

  # ── Frontend React ─────────────────────────────────────────────────────────
  - type: web
    name: cliniqueci-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # à renseigner manuellement : https://cliniqueci-api.onrender.com/api

databases:
  - name: cliniqueci-db
    databaseName: cliniqueci
    user: cliniqueci
    plan: free
