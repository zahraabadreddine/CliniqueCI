services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cliniqueci
      POSTGRES_USER: cliniqueci
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniqueci"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
