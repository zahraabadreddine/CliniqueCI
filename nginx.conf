events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  upstream api {
    server server:3001;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    # NOTE: Remplacer cliniqueci.ci par votre domaine réel avant déploiement
    server_name cliniqueci.ci;

    # NOTE: Remplacer cliniqueci.ci par votre domaine réel (chemins Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/cliniqueci.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cliniqueci.ci/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
