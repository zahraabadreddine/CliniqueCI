services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cliniqueci
      POSTGRES_USER: cliniqueci
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniqueci"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cliniqueci:${DB_PASSWORD}@db:5432/cliniqueci
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
      - client
    restart: unless-stopped

volumes:
  pgdata:
